name: repeatlab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules without symlinks
        run: |
          git submodule init
          git -c core.symlinks=false submodule update --recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        working-directory: repeatlab_app
        run: flutter pub get
      - name: Analyze project
        working-directory: repeatlab_app
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules without symlinks
        run: |
          git submodule init
          git -c core.symlinks=false submodule update --recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        working-directory: repeatlab_app
        run: flutter pub get
      - name: Run tests
        working-directory: repeatlab_app
        run: flutter test

  e2e-android:
    name: E2E (Android emulator)
    runs-on: ubuntu-latest
    # E2E is slower and heavier than the host suite — keep it a separate job so
    # analyze/test stay fast. Runs the Patrol flows under integration_test/.
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules without symlinks
        run: |
          git submodule init
          git -c core.symlinks=false submodule update --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        working-directory: repeatlab_app
        run: flutter pub get
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
      - name: Run Patrol E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: repeatlab_app
          script: patrol test
