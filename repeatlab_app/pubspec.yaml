name: repeatlab
description: Audio loop studio
version: 2.2.3+94
publish_to: none

environment:
  flutter: 3.44.4
  sdk: 3.12.2

dependencies:
  archive: ^4.0.9
  audio_metadata_reader: ^1.6.0
  # audio_service: ^0.18.18
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  # audioplayers: ^6.4.0
  audioplayers:
    path: ../ap/packages/audioplayers

  audioplayers_android_exo:
    path: ../ap/packages/audioplayers_android_exo

  # audiotags:
  #   git:
  #     url: https://github.com/erikas-taroza/audiotags.git
  #     ref: master
  bloc: ^9.2.1
  bloc_test: ^10.0.0

  clarity_flutter: ^1.9.0
  crypto: ^3.0.7
  dart_mappable: ^4.8.0
  # device_preview_plus: ^2.6.0
  ffmpeg_kit_flutter_new_min: ^3.5.3
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_auto_size_text: ^5.0.0
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^4.0.3
  flutter_soloud: ^4.0.13

  flutter_svg: ^2.3.0
  in_app_review: ^2.0.12
  intl: ^0.20.2
  # just_audio: ^0.10.4
  # just_audio_background: ^0.0.1-beta.17
  lint: ^2.8.0
  lottie: ^3.5.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  posthog_flutter: ^5.32.1
  # Own package (github.com/novas1r1/precise_metronome). Pinned to the
  # feat/phase-control commit that adds start(initialDelay:)/nudge();
  # TODO: switch ref to the v0.3.0 tag once device-verified and published.
  precise_metronome:
    git:
      url: https://github.com/novas1r1/precise_metronome.git
      ref: main
  purchases_flutter: ^10.4.2
  purchases_ui_flutter: ^10.4.2
  sembast: ^3.8.6
  sentry_flutter: ^9.24.0
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  tutorial_coach_mark: ^1.3.3
  url_launcher: ^6.3.2
  userorient_flutter: ^2.1.2
  uuid: ^4.5.3
  wiredash: ^2.6.1

dependency_overrides:
  # Local fork adds setPitchShift; audioplayers/audioplayers_android_exo are
  # already path deps, but the platform interface would otherwise resolve from
  # pub.dev and miss the new API.
  # Local fork seeks with zero tolerance so loop wraps land exactly on the
  # loop start (AVPlayer's default tolerance is unbounded).
  audioplayers_darwin:
    path: ../ap/packages/audioplayers_darwin
  audioplayers_platform_interface:
    path: ../ap/packages/audioplayers_platform_interface
  # TODO: Remove once Xcode is updated to 26.1+.
  # device_info_plus 12.4.0+ references isiOSAppOnVision (iOS 26.1 SDK).
  device_info_plus: 13.2.0

dev_dependencies:
  alchemist: ^0.14.0

  build_runner: ^2.13.1
  dart_mappable_builder: ^4.8.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  patrol: ^4.6.1
  # flutter_launcher_icons: ^0.14.3
  # flutter_native_splash: ^2.4.4
patrol:
  app_name: RepeatLab
  test_directory: integration_test
  android:
    package_name: com.repeatlab.app
  ios:
    bundle_id: com.repeatlab.app

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans_7pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans_7pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans_7pt-Light.ttf
          weight: 300
        - asset: assets/fonts/NunitoSans_7pt-Italic.ttf
          weight: 400
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
