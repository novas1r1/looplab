name: repeatlab
description: Audio loop studio
version: 1.1.12+43
publish_to: none

environment:
  flutter: 3.32.3
  sdk: ^3.8.1

dependencies:
  audio_metadata_reader:
    git:
      url: https://github.com/novas1r1/audio_metadata_reader.git
      ref: main

  # audio_service: ^0.18.18
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  # audioplayers: ^6.4.0
  audioplayers: ^6.4.0

  # audiotags:
  #   git:
  #     url: https://github.com/erikas-taroza/audiotags.git
  #     ref: master
  bloc: ^9.0.0
  dart_mappable: ^4.5.0
  # ffmpeg_kit_flutter_new: ^1.6.1
  file_picker: ^10.1.9
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^3.1.10

  # google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  in_app_review: ^2.0.10
  intl: ^0.20.2
  # just_audio: ^0.10.4
  # just_audio_background: ^0.0.1-beta.17
  lint: ^2.8.0
  lottie: ^3.3.1
  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  purchases_flutter: ^8.10.0
  # purchases_ui_flutter: ^8.4.1
  sembast: ^3.8.5
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3
  tutorial_coach_mark: ^1.3.0
  url_launcher: ^6.3.1
  userorient_flutter: ^1.1.0
  uuid: ^4.5.1
  wiredash: ^2.5.0

dev_dependencies:
  alchemist: ^0.12.0

  bloc_test: ^10.0.0
  build_runner: ^2.4.12
  dart_mappable_builder: ^4.5.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  # flutter_launcher_icons: ^0.14.3
  # flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans_7pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans_7pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans_7pt-Light.ttf
          weight: 300
        - asset: assets/fonts/NunitoSans_7pt-Italic.ttf
          weight: 400
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
