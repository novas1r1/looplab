name: repeatlab
description: Audio loop studio
version: 1.4.3+60
publish_to: none

environment:
  flutter: 3.35.7
  sdk: ^3.8.1

dependencies:
  audio_metadata_reader: ^1.4.2

  # audio_service: ^0.18.18
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  # audioplayers: ^6.4.0
  audioplayers: ^6.5.1

  # audiotags:
  #   git:
  #     url: https://github.com/erikas-taroza/audiotags.git
  #     ref: master
  bloc: ^9.1.0
  bloc_test: ^10.0.0

  clarity_flutter: ^1.4.3
  dart_mappable: ^4.5.0
  ffmpeg_kit_flutter_new_min: ^3.1.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^4.0.3
  flutter_soloud: ^3.3.9

  flutter_svg: ^2.2.0
  in_app_review: ^2.0.10
  intl: ^0.20.2
  # just_audio: ^0.10.4
  # just_audio_background: ^0.0.1-beta.17
  lint: ^2.8.0
  lottie: ^3.3.1
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  purchases_flutter: ^8.11.0
  # purchases_ui_flutter: ^8.4.1
  sembast: ^3.8.5
  sentry_flutter: ^9.6.0
  shared_preferences: ^2.5.3
  tutorial_coach_mark: ^1.3.0
  url_launcher: ^6.3.2
  userorient_flutter: ^1.4.4
  uuid: ^4.5.1
  wiredash: ^2.6.0

dev_dependencies:
  alchemist: ^0.13.0

  build_runner: ^2.5.4
  dart_mappable_builder: ^4.5.0
  flutter_test:
    sdk: flutter
  mockito: ^5.5.0
  mocktail: ^1.0.4
  # flutter_launcher_icons: ^0.14.3
  # flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans_7pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans_7pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans_7pt-Light.ttf
          weight: 300
        - asset: assets/fonts/NunitoSans_7pt-Italic.ttf
          weight: 400
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
