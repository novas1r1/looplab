name: repeatlab
description: Audio loop studio
version: 2.0.0+83
publish_to: none

environment:
  flutter: 3.41.9
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  archive: ^4.0.8
  audio_metadata_reader: ^1.4.2
  # audio_service: ^0.18.18
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  # audioplayers: ^6.4.0
  audioplayers:
    path: ../../packages/audioplayers/packages/audioplayers

  audioplayers_android_exo:
    path: ../../packages/audioplayers/packages/audioplayers_android_exo

  # audiotags:
  #   git:
  #     url: https://github.com/erikas-taroza/audiotags.git
  #     ref: master
  bloc: ^9.2.0
  bloc_test: ^10.0.0

  clarity_flutter: ^1.8.0
  crypto: ^3.0.6
  dart_mappable: ^4.7.0
  # device_preview_plus: ^2.6.0
  ffmpeg_kit_flutter_new_min: ^3.1.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_auto_size_text: ^5.0.0
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^4.0.3
  flutter_soloud: ^4.0.2

  flutter_svg: ^2.2.4
  in_app_review: ^2.0.11
  intl: ^0.20.2
  # just_audio: ^0.10.4
  # just_audio_background: ^0.0.1-beta.17
  lint: ^2.8.0
  lottie: ^3.3.3
  # Video playback (libmpv-based; cross-platform, supports mp4, mov, mkv, webm, avi, …)
  media_kit: ^1.2.0
  media_kit_libs_video: ^1.0.6
  media_kit_video: ^1.3.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  purchases_flutter: ^9.16.1
  purchases_ui_flutter: ^9.16.1
  sembast: ^3.8.6
  sentry_flutter: ^9.16.1
  share_plus: ^12.0.0
  shared_preferences: ^2.5.5
  tutorial_coach_mark: ^1.3.3
  url_launcher: ^6.3.2
  userorient_flutter: ^2.1.0
  uuid: ^4.5.3
  wiredash: ^2.6.0

dev_dependencies:
  alchemist: ^0.14.0

  build_runner: ^2.13.1
  dart_mappable_builder: ^4.7.0
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  mocktail: ^1.0.5
  # flutter_launcher_icons: ^0.14.3
  # flutter_native_splash: ^2.4.4

dependency_overrides:
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans_7pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans_7pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans_7pt-Light.ttf
          weight: 300
        - asset: assets/fonts/NunitoSans_7pt-Italic.ttf
          weight: 400
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
